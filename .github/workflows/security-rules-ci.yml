name: Security Rules CI

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'database.rules.json'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'roles/**'
      - 'rules-test/**'
      - 'firebase.json'
      - '.github/workflows/security-rules-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'database.rules.json'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'roles/**'
      - 'rules-test/**'
      - 'firebase.json'
      - '.github/workflows/security-rules-ci.yml'

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-test/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules test dependencies
        run: npm ci
        working-directory: rules-test

      - name: Run Firestore, Realtime Database, and Storage rules tests
        run: npm test
        working-directory: rules-test

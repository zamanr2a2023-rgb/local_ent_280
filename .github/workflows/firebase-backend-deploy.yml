name: Firebase Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'database.rules.json'
      - 'storage.rules'
      - 'roles/**'
      - 'functions/**'
      - '.github/workflows/firebase-backend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: firebase-backend-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="${{ github.event.inputs.environment }}"
          else
            environment="dev"
          fi

          if [ "$environment" = "prod" ]; then
            echo "FIREBASE_PROJECT_ID=local-transport-prod" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_PROJECT_ID=local-transport-482015" >> "$GITHUB_ENV"
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud for dev
        if: steps.target.outputs.environment == 'dev'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_BACKEND_SERVICE_ACCOUNT_DEV }}

      - name: Authenticate to Google Cloud for prod
        if: steps.target.outputs.environment == 'prod'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_BACKEND_SERVICE_ACCOUNT_PROD }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Deploy Firebase backend
        shell: bash
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore,database,storage,functions \
            --non-interactive \
            --force

      - name: Enforce Artifact Registry cleanup policy
        shell: bash
        run: |
          firebase functions:artifacts:setpolicy \
            --project "$FIREBASE_PROJECT_ID" \
            --location europe-southwest1 \
            --days 30 \
            --force
          firebase functions:artifacts:setpolicy \
            --project "$FIREBASE_PROJECT_ID" \
            --location europe-west1 \
            --days 30 \
            --force
